<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Navbar Project</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <!-- JS Required -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>

<body>

<!-- 1. Basic Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <a class="navbar-brand" href="#">MySite</a>

  <!-- Toggle Button -->
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbar1">
    <span class="navbar-toggler-icon"></span>
  </button>

  <!-- Links -->
  <div class="collapse navbar-collapse" id="navbar1">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item active">
        <a class="nav-link" href="#">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Link</a>
      </li>

      <!-- Dropdown -->
      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" data-toggle="dropdown" href="#">
          Menu
        </a>
        <div class="dropdown-menu">
          <a class="dropdown-item" href="#">Sub 1</a>
          <a class="dropdown-item" href="#">Sub 2</a>
        </div>
      </li>
    </ul>

    <!-- Form -->
    <form class="form-inline">
      <input class="form-control mr-sm-2" type="text" placeholder="Search">
      <button class="btn btn-success" type="submit">Search</button>
    </form>

  </div>
</nav>

<!-- 2. Centered Navbar -->
<nav class="navbar navbar-expand-sm bg-primary navbar-dark justify-content-center mt-3">
  <ul class="navbar-nav">
    <li class="nav-item">
      <a class="nav-link active" href="#">Center 1</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#">Center 2</a>
    </li>
  </ul>
</nav>

<!-- 3. Dark Navbar with Text -->
<nav class="navbar navbar-expand-sm bg-dark navbar-dark mt-3">
  <ul class="navbar-nav">
    <li class="nav-item">
      <a class="nav-link" href="#">Link</a>
    </li>
  </ul>
  <span class="navbar-text">Navbar Text</span>
</nav>

<!-- 4. Fixed Top Navbar -->
<nav class="navbar navbar-expand-sm bg-info navbar-dark fixed-top">
  <a class="navbar-brand" href="#">Top Fixed</a>
</nav>

<div style="margin-top:80px"></div>

<!-- 5. Sticky Navbar -->
<nav class="navbar navbar-expand-sm bg-warning navbar-dark sticky-top mt-3">
  <a class="navbar-brand" href="#">Sticky Navbar</a>
</nav>

<div style="height:600px">
  <h3 class="text-center mt-5">Scroll to see sticky effect</h3>
</div>

<!-- 6. Fixed Bottom Navbar -->
<nav class="navbar navbar-expand-sm bg-danger navbar-dark fixed-bottom">
  <a class="navbar-brand" href="#">Bottom Fixed</a>
</nav>

</body>
</html>
